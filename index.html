<!DOCTYPE html>
<html lang="ko"><head>
<script>try{var _t=localStorage.getItem('ecat-admin-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자카달로그 — 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/admin.css">
<style>:root{--accent:#3b5bdb}</style>
</head>
<body class="cms">
<div class="login-wrap"><div class="login-card">
  <div class="brand"><div class="logo">전</div><b id="authSub">전자카달로그 관리자</b></div>
  <div class="card"><div class="card-b">
    <form id="authForm">
      <div class="field"><label>이메일</label><input class="inp" type="email" id="email" required placeholder="you@example.com"></div>
      <div class="field"><label>비밀번호</label><input class="inp" type="password" id="password" required placeholder="6자 이상"></div>
      <div id="authErr" class="flash-box err" style="display:none;margin-bottom:12px"></div>
      <button type="submit" class="btn pri" id="authBtn" style="width:100%">로그인</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:14px">
      <span id="toggleTxt">계정이 없으신가요?</span>
      <a href="#" id="toggleLink" style="color:var(--accent);font-weight:600">회원가입</a>
    </p>
  </div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script>
(async function(){
  if (await API.user()) { location.href = 'app.html'; return; }
  var mode = 'login';
  var f = document.getElementById('authForm'), btn = document.getElementById('authBtn'),
      err = document.getElementById('authErr'), sub = document.getElementById('authSub'),
      tgl = document.getElementById('toggleLink'), tt = document.getElementById('toggleTxt');
  function setMode(m){
    mode = m;
    btn.textContent = m==='login' ? '로그인' : '회원가입';
    sub.textContent = m==='login' ? '전자카달로그 관리자' : '이메일로 간편 가입';
    tt.textContent  = m==='login' ? '계정이 없으신가요?' : '이미 계정이 있으신가요?';
    tgl.textContent = m==='login' ? '회원가입' : '로그인';
    err.style.display='none';
  }
  tgl.addEventListener('click', function(e){ e.preventDefault(); setMode(mode==='login'?'signup':'login'); });
  f.addEventListener('submit', async function(e){
    e.preventDefault(); err.style.display='none'; btn.disabled=true;
    var em=document.getElementById('email').value.trim(), pw=document.getElementById('password').value;
    try {
      if (mode==='login') { await API.signIn(em,pw); location.href='app.html'; }
      else {
        var r = await API.signUp(em,pw);
        if (r.session) { location.href='app.html'; }
        else { err.textContent='가입 완료! 이메일 인증 후 로그인하세요.'; err.classList.remove('err'); err.style.display='block'; setMode('login'); }
      }
    } catch(ex) { err.textContent = (ex.message||ex); err.classList.add('err'); err.style.display='block'; }
    btn.disabled=false;
  });
})();
</script>
</body></html>
