<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자카달로그 — 로그인</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="ecat-auth">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">📖 전자카달로그</div>
    <div class="auth-sub" id="authSub">로그인하고 카달로그를 만드세요</div>

    <form class="auth-form" id="authForm">
      <label>이메일<input type="email" id="email" required placeholder="you@example.com"></label>
      <label>비밀번호<input type="password" id="password" required placeholder="6자 이상"></label>
      <div id="authErr" class="err" style="font-size:.85rem;margin-bottom:8px;display:none"></div>
      <button type="submit" id="authBtn">로그인</button>
    </form>

    <p class="muted sm" style="text-align:center;margin-top:16px">
      <span id="toggleTxt">계정이 없으신가요?</span>
      <a href="#" id="toggleLink" style="color:var(--brand);font-weight:600">회원가입</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script>
(async function(){
  // 이미 로그인 상태면 마이페이지로
  if (await API.user()) { location.href = 'app.html'; return; }

  var mode = 'login';
  var f = document.getElementById('authForm'), btn = document.getElementById('authBtn'),
      err = document.getElementById('authErr'), sub = document.getElementById('authSub'),
      tgl = document.getElementById('toggleLink'), tt = document.getElementById('toggleTxt');

  function setMode(m){
    mode = m;
    btn.textContent = m==='login' ? '로그인' : '회원가입';
    sub.textContent = m==='login' ? '로그인하고 카달로그를 만드세요' : '이메일로 간편 가입하세요';
    tt.textContent  = m==='login' ? '계정이 없으신가요?' : '이미 계정이 있으신가요?';
    tgl.textContent = m==='login' ? '회원가입' : '로그인';
    err.style.display='none';
  }
  tgl.addEventListener('click', function(e){ e.preventDefault(); setMode(mode==='login'?'signup':'login'); });

  f.addEventListener('submit', async function(e){
    e.preventDefault(); err.style.display='none'; btn.disabled=true;
    var em=document.getElementById('email').value.trim(), pw=document.getElementById('password').value;
    try {
      if (mode==='login') { await API.signIn(em,pw); location.href='app.html'; }
      else {
        var r = await API.signUp(em,pw);
        if (r.session) { location.href='app.html'; }
        else { err.textContent='가입 완료! 이메일 인증 후 로그인하세요. (Supabase 설정에서 이메일 확인을 끄면 바로 로그인됩니다)'; err.style.color='#166534'; err.style.display='block'; setMode('login'); }
      }
    } catch(ex) { err.textContent = (ex.message||ex); err.style.color='#b91c1c'; err.style.display='block'; }
    btn.disabled=false;
  });
})();
</script>
</body></html>
