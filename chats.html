<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 채팅 — 관리자</title>
<script>try{var _t=localStorage.getItem('ecat-admin-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/admin.css">
<style>
:root{--accent:#3b5bdb}
.chl{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.chl{grid-template-columns:1fr}}
.chl-list a{display:block;padding:12px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.chl-list a:first-child{border-top:0}
.chl-list a.on{background:var(--accent-weak)}
.chl-list .q{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chl-list .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px}
.chl-log{display:flex;flex-direction:column;gap:10px;padding:16px;max-height:70vh;overflow-y:auto}
.chl-log .m{display:flex;flex-direction:column;max-width:78%}
.chl-log .m.user{align-self:flex-end;align-items:flex-end}
.chl-log .b{padding:9px 13px;border-radius:14px;line-height:1.5;white-space:pre-line;font-size:14px}
.chl-log .m.ai .b{background:var(--panel2,#f2f2f2);border:1px solid var(--line);border-bottom-left-radius:4px}
.chl-log .m.user .b{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chl-log .t{font-size:11px;color:var(--muted);margin-top:3px}
</style>
</head>
<body class="admin bd-admin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/shell.js"></script>
<script src="js/chats.js"></script>
</body></html>
