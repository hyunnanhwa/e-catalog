<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 카달로그</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { background:var(--bg); }
  .mp-top { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:#fff; border-bottom:1px solid var(--line); }
  .mp-brand { font-weight:800; font-size:1.1rem; }
  .mp-wrap { max-width:940px; margin:26px auto; padding:0 20px; }
  .mp-share { width:100%; box-sizing:border-box; margin-top:10px; padding:8px 11px; border:1px solid var(--line); border-radius:8px; font-size:.82rem; font-family:ui-monospace,monospace; background:#f8fafc; }
  .cx-set { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .cx-set input, .cx-set select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:.85rem; }
  .cx-set input.bgm { flex:1; min-width:180px; }
  .inq-list { margin-top:10px; max-height:300px; overflow:auto; }
  .inq { border-top:1px solid var(--line); padding:10px 2px; font-size:.88rem; }
  .inq b { font-weight:700; }
</style>
</head>
<body>
<div class="mp-top">
  <div class="mp-brand">📖 내 카달로그</div>
  <div><span class="muted sm" id="meEmail"></span> <a href="#" id="logout" class="btn-sm ghost" style="margin-left:10px">로그아웃</a></div>
</div>
<div class="mp-wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px">
    <div><h1 style="margin:0 0 4px">카달로그 목록</h1><p class="muted sm" style="margin:0">만들고 편집한 뒤, 미리보기 링크를 공유하세요.</p></div>
    <button class="btn-primary" id="newBtn">＋ 새 카달로그</button>
  </div>
  <div id="list" class="cx-langs"><p class="muted">불러오는 중…</p></div>
</div>

<!-- 문의내역 모달 -->
<div id="inqModal" class="modal-back" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>문의 내역</h3>
    <div class="inq-list" id="inqBody"></div>
    <div class="modal-actions"><button class="btn-sm ghost" onclick="document.getElementById('inqModal').style.display='none'">닫기</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/app.js"></script>
</body></html>
