<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자카달로그 — 샘플</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="assets/catalog-viewer.css">
</head>
<body class="cv-body">
<div id="cv"></div>

<script>
/* 자립형 샘플 — Supabase 없이 기존 catalog-viewer.js를 그대로 구동한다.
   3개 언어(한국어/English/日本語) 데이터를 내장하고, 국기 클릭 시 ?lang= 로 전환한다. */
(function () {
  var LANG = new URLSearchParams(location.search).get('lang') || 'ko';
  if (['ko', 'en', 'ja'].indexOf(LANG) < 0) LANG = 'ko';

  // 언어별 문구
  var T = {
    ko: { brand: '카달로그', tag: '전자카달로그 · 인터랙티브 데모', h2: '고급 인쇄, 정교한 디자인',
          body: '브로슈어 · 카달로그 · 패키지까지. 파워포인트처럼 편집하고, 링크 하나로 어디서든 열람하세요. 이미지·영상·배경음악·문의폼을 그대로 담을 수 있습니다.',
          feat: ['✓ PPT형 드래그 편집', '✓ 이미지·영상·배경음악', '✓ 다국어 국기 전환', '✓ 문의폼 이메일 접수'],
          ctitle: '문의하기', csub: '아래 양식을 남겨 주시면 담당자가 연락드립니다.', send: '문의 보내기' },
    en: { brand: 'Catalog', tag: 'E-Catalog · Interactive Demo', h2: 'Premium Print, Refined Design',
          body: 'Brochures, catalogs, packaging and more. Edit it like PowerPoint and share one link to view anywhere — with images, video, background music and an inquiry form built in.',
          feat: ['✓ PPT-style drag editing', '✓ Image · Video · BGM', '✓ Flag language switch', '✓ Inquiry form to email'],
          ctitle: 'Contact Us', csub: 'Leave your details and we will get back to you.', send: 'Send Inquiry' },
    ja: { brand: 'カタログ', tag: '電子カタログ · インタラクティブデモ', h2: '高級印刷、精緻なデザイン',
          body: 'ブローシャー・カタログ・パッケージまで。パワーポイントのように編集し、リンク一つでどこでも閲覧。画像・動画・BGM・お問い合わせフォームをそのまま収録できます。',
          feat: ['✓ PPT型ドラッグ編集', '✓ 画像・動画・BGM', '✓ 国旗で言語切替', '✓ フォームでメール受付'],
          ctitle: 'お問い合わせ', csub: '以下のフォームをご記入ください。担当者よりご連絡します。', send: '送信する' }
  };
  var t = T[LANG];

  function el(o) { return o; }
  // 슬라이드 3장: 표지 / 소개 / 문의
  function slides() {
    var featTxt = t.feat.map(function (f) { return f; }).join('<br>');
    return [
      // 1) 표지 — 그라데이션 배경 + 타이틀
      { bg: '#0b1220', elements: [
        el({ type: 'box', x: 0, y: 0, w: 100, h: 100, z: 1, fillType: 'gradient', color1: '#1e3a8a', color2: '#7c3aed', gradAngle: 135, radius: 0 }),
        el({ type: 'box', x: 0, y: 0, w: 100, h: 100, z: 2, fillType: 'gradient', color1: '#000000', gradEnd: 'transparent', gradAngle: 0 }),
        el({ type: 'text', x: 10, y: 33, w: 80, h: 16, z: 3, html: t.brand, size: 8, align: 'center', color: '#ffffff', fw: 800, aos: 'fade-up' }),
        el({ type: 'text', x: 10, y: 52, w: 80, h: 8, z: 3, html: t.tag, size: 2.8, align: 'center', color: '#c7d2fe', fw: 500, aos: 'fade-up', aosDelay: 150 })
      ]},
      // 2) 소개 — 헤딩 + 본문 + 특징 + 포인트 박스
      { bg: '#ffffff', elements: [
        el({ type: 'box', x: 0, y: 0, w: 34, h: 100, z: 1, fillType: 'gradient', color1: '#06b6d4', color2: '#3b82f6', gradAngle: 160, radius: 0 }),
        el({ type: 'text', x: 6, y: 20, w: 24, h: 30, z: 2, html: t.h2, size: 4.4, align: 'left', color: '#ffffff', fw: 800, lh: 1.2, aos: 'fade-right' }),
        el({ type: 'text', x: 40, y: 20, w: 54, h: 30, z: 2, html: t.body, size: 2.3, align: 'left', color: '#334155', lh: 1.7, aos: 'fade-up' }),
        el({ type: 'text', x: 40, y: 56, w: 54, h: 30, z: 2, html: featTxt, size: 2.3, align: 'left', color: '#0f766e', fw: 700, lh: 2.0, aos: 'fade-up', aosDelay: 150 })
      ]},
      // 3) 문의 — 폼(개별 필드 + 전송 버튼)
      { bg: '#0f172a', elements: [
        el({ type: 'text', x: 10, y: 8, w: 80, h: 10, z: 2, html: t.ctitle, size: 4.4, align: 'center', color: '#ffffff', fw: 800, aos: 'fade-up' }),
        el({ type: 'text', x: 10, y: 17, w: 80, h: 6, z: 2, html: t.csub, size: 2, align: 'center', color: '#94a3b8', aos: 'fade-up' }),
        el({ type: 'field', id: 'f_name', fk: 'name', x: 27, y: 26, w: 46, h: 9, z: 2, size: 2, color: '#e2e8f0', labelColor: '#cbd5e1', bg: '#ffffff', radius: 8 }),
        el({ type: 'field', id: 'f_phone', fk: 'phone', x: 27, y: 37, w: 46, h: 9, z: 2, size: 2, color: '#e2e8f0', labelColor: '#cbd5e1', bg: '#ffffff', radius: 8 }),
        el({ type: 'field', id: 'f_email', fk: 'email', x: 27, y: 48, w: 46, h: 9, z: 2, size: 2, color: '#e2e8f0', labelColor: '#cbd5e1', bg: '#ffffff', radius: 8 }),
        el({ type: 'field', id: 'f_msg', fk: 'message', x: 27, y: 59, w: 46, h: 16, z: 2, size: 2, color: '#e2e8f0', labelColor: '#cbd5e1', bg: '#ffffff', radius: 8 }),
        el({ type: 'submit', id: 's_1', x: 27, y: 78, w: 46, h: 8, z: 2, text: t.send, bg: '#06b6d4', color: '#ffffff', size: 2.3, radius: 8, to: 'demo@example.com' })
      ]}
    ];
  }

  var LANGDEF = { ko: ['한국어', 'kr'], en: ['English', 'us'], ja: ['日本語', 'jp'] };
  var langs = Object.keys(LANGDEF).map(function (c) { return { lang: c, token: c, name: LANGDEF[c][0], cc: LANGDEF[c][1] }; });

  var boot = {
    aspect: '16:9', radius: 12, point: '#06b6d4',
    slides: slides(),
    bgmYt: 'JmQEkWAUG7k', autoplay: 0,
    outerBg: '', outerImg: '', outerOpacity: 1, outerBlur: 0,
    token: 'sample-' + LANG, formUrl: 'sample:form',
    langs: langs, curLang: LANG, preview: false
  };
  document.title = t.brand + ' — 샘플';

  // 문의폼 전송: 샘플이라 실제 발송 대신 안내
  var of = window.fetch.bind(window);
  window.fetch = function (u, o) {
    if (u === 'sample:form') { alert('✅ 샘플 미리보기입니다.\n실제 배포본에서는 이 문의가 이메일과 문의내역(DB)으로 접수됩니다.'); return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ ok: true }); } }); }
    return of(u, o);
  };
  // 국기 클릭 → 같은 페이지에서 언어 전환(캡처 단계로 뷰어 기본 이동을 가로챔)
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.cv-lang');
    if (b && b.dataset.token) { ev.stopImmediatePropagation(); ev.preventDefault(); location.href = 'sample.html?lang=' + b.dataset.token; }
  }, true);

  var tag = document.createElement('script'); tag.type = 'application/json'; tag.id = 'cv-boot';
  tag.textContent = JSON.stringify(boot); document.body.appendChild(tag);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/catalog-viewer.js"></script>
</body></html>
